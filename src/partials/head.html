<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{canonical}}">
<link rel="alternate" hreflang="x-default" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dev John">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://devjohn.site/images/og-default.png">
<meta property="og:image:alt" content="Dev John, John Mwaura, web and software developer in Kenya">
<meta property="og:locale" content="en_KE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">

<meta name="twitter:image" content="https://devjohn.site/images/og-default.png">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">

<link rel="icon" href="/favicon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pages.css">
<noscript><style>.fade { opacity: 1; transform: none; }</style></noscript>
